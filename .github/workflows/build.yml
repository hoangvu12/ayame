name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build DLLs and CLI
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          build.bat

      - name: Verify CLI
        shell: cmd
        run: dist\ayame.exe version

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ayame-windows-x64
          path: |
            dist/ayame.exe
            dist/EOSSDK-Win64-Shipping.dll
            dist/winmm.dll
            dist/eossmoke.exe
